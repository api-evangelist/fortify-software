  /api/v3/releases/{releaseId}/dast-automated-scans/scan-setup/file-upload:
    patch:
      tags:
      - DastAutomatedScans
      summary: Uploads a Dast Automated file to release
      operationId: DastAutomatedScansV3_PatchDastAutomatedScanFileUpload
      consumes: []
      produces:
      - application/json
      - text/json
      - application/xml
      - text/xml
      parameters:
      - name: releaseId
        in: path
        description: Release ID
        required: true
        type: integer
        format: int32
      - name: dastFileType
        in: query
        description: DAST Automated file type
        required: true
        type: string
        enum:
        - OpenAPIDefinition
        - PostmanCollection
        - GraphQLDefinition
        - GRPCDefinition
        - WorkflowDrivenMacro
        - LoginMacro
      responses:
        '200':
          description: Ok
          schema:
            $ref: '#/definitions/PatchDastAutomatedScanManifestResponse'
        '400':
          description: BadRequest
          schema:
