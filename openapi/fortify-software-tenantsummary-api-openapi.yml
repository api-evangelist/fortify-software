swagger: '2.0'
info:
  version: v3
  title: OpenText™ Core Application Security Web API Explorer ApiKeyManagement TenantSummary API
host: api.ams.fortify.com
schemes:
- https
tags:
- name: TenantSummary
paths:
  /api/v3/tenant-summary:
    get:
      tags:
      - TenantSummary
      summary: Retrieves a summary of the tenant
      description: 'Allowed Scopes: api-tenant, view-tenant-data'
      operationId: TenantSummaryV3_GetTenantSummary
      consumes: []
      produces:
      - application/json
      - text/json
      - application/xml
      - text/xml
      parameters:
      - name: daysFrom
        in: query
        description: Days back to look
        required: false
        type: integer
        format: int32
      - name: sdlcStatus
        in: query
        description: The SDLC Status to retrieve information about
        required: false
        type: string
        enum:
        - Production
        - QA
        - Development
        - Retired
      responses:
        '200':
          description: Ok
          schema:
            $ref: '#/definitions/TenantSummaryListResponse'
        '401':
          description: Unauthorized
        '422':
          description: UnprocessableEntity
          schema:
            $ref: '#/definitions/ErrorResponse'
        '429':
          description: TooManyRequests
        '500':
          description: InternalServerError
definitions:
  ErrorResponse:
    description: Error Response
    type: object
    properties:
      errors:
        description: List of errors
        type: array
        items:
          $ref: '#/definitions/Error'
  TenantSummary:
    description: Tenant Summary
    type: object
