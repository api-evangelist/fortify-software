aid: fortify-software
name: Fortify Software
description: >-
  Fortify Software is the application security (AppSec) business now delivered as
  OpenText Core Application Security, better known by its long-running Fortify brand.
  Founded in 2003 in San Mateo, California, Fortify pioneered static application
  security testing (SAST) and was acquired by HP in 2010, moved to Micro Focus in
  2017, and to OpenText in 2023. Its flagship SaaS, Fortify on Demand (FoD),
  provides SAST, DAST, mobile (MAST), and open-source/software-composition analysis
  as a service, and exposes a documented Fortify on Demand REST API (v3) covering
  applications, releases, scans, vulnerabilities, reports, users, tenants, and
  personal access tokens. Authentication is OAuth 2.0 (client-credentials token
  endpoint) with granular tenant scopes, plus personal access tokens and API keys.
  A rich GitHub organization (github.com/fortify) ships first-party tooling
  including the fcli command-line utility and Software Security Center REST clients.
